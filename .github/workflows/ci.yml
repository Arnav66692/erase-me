name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: pip install pytest coverage
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build public workspace
        run: python tools/build_preview.py
      - name: Check interface behavior
        run: node --test tests/test_manual_ui.cjs tests/test_workspace_core.cjs tests/test_companion.cjs tests/test_broker_catalog.cjs tests/test_removal_mail_client.cjs
      - name: Run tests
        run: python -m pytest -m "not network"
      - name: Validate reference data
        run: python skills/erase-me/scripts/erase_me.py validate
